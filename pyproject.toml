[project]
name = "dsn-mui-source-connector"
version = "0.5.0"
description = "Source connector for the DSN-MUI fatwa corpus (dsnmui.or.id) — automated retrieval of structured raw data, no LLM."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pymupdf>=1.24",
    "metamorph-contract",
    "metamorph-pdf-text",  # METAMORPH_PDF_ENGINE=mineru: MinerU, checked against the text layer
]

[project.scripts]
dsn = "dsn_ingest.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
metamorph-contract = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-contract", editable = true }
metamorph-pdf-text = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-pdf-text", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsn_ingest"]
