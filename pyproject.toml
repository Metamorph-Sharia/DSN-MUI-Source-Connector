[project]
name = "dsn-mui-source-connector"
version = "0.3.1"
description = "Source connector for the DSN-MUI fatwa corpus (dsnmui.or.id) — automated retrieval of structured raw data, no LLM."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pymupdf>=1.24",
]

[project.scripts]
dsn = "dsn_ingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsn_ingest"]
